# Render Blueprint — deploy in un click da questo repo.
# Su Render: New > Blueprint > seleziona il repo. Poi imposta i secret.
services:
  - type: web
    name: calibot
    runtime: node
    # starter (non free): niente sleep e supporto al disco persistente qui sotto.
    # Sul free tier il filesystem si azzera a ogni riavvio e le modifiche del gestore si perdono.
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false # da inserire nella dashboard (secret, non versionato)
      - key: ADMIN_PASSWORD
        sync: false # opzionale: password area gestore (default reportaid123!)
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
    # Disco persistente: qui vive data/state.json (config, documenti, codice di accesso).
    disk:
      name: calibot-data
      mountPath: /var/data
      sizeGB: 1
